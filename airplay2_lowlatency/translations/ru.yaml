---
configuration:
  airplay_name:
    name: Имя приёмника
    description: Имя, отображаемое в списке устройств AirPlay.
  audio_profile:
    name: Аудиопрофиль
    description: >-
      Стабильный профиль рекомендован по умолчанию. Минимальный даёт наименьшую
      задержку, но при нестабильной сети возможны щелчки; стабильный использует
      больший буфер.
  custom_buffer_seconds:
    name: Пользовательский буфер (секунды)
    description: >-
      Используется только с пользовательским профилем. Выберите значение от 0.08
      до 0.50 секунды.
  offset_seconds:
    name: Смещение аудио (секунды)
    description: >-
      Расширенная настройка синхронизации. Оставьте ноль, если измерения не
      требуют коррекции.
  interpolation:
    name: Интерполяция
    description: >-
      Расширенный режим ресемплинга. Рекомендуется автоматический режим.
  default_airplay_volume:
    name: Начальная громкость AirPlay (дБ)
    description: >-
      Начальная громкость отдельного потока от -30 до 0 дБ. Она не меняет
      громкость устройства Home Assistant.
  diagnostics:
    name: Диагностика
    description: Включает подробную статистику Shairport Sync в журнале аддона.
  volume_curve:
    name: Кривая громкости
    description: >-
      Сбалансированная сохраняет существующий диапазон 60 дБ. Тихий старт
      использует 90 дБ, чтобы нижняя часть ползунка AirPlay была тише.
